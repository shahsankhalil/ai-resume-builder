<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Resume Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 32px 16px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1a1a2e;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .card h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
      margin-top: 14px;
    }

    label:first-of-type { margin-top: 0; }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a2e;
      background: #f9fafb;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #6366f1;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 80px; }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .output-card {
      grid-column: 1 / -1;
      display: none;
    }

    .output-card.visible { display: block; }

    #resume-output {
      white-space: pre-wrap;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a2e;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      min-height: 120px;
    }

    .copy-btn {
      margin-top: 14px;
      padding: 9px 20px;
      background: #f3f4f6;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #374151;
      transition: background 0.2s;
    }

    .copy-btn:hover { background: #e5e7eb; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: #dc2626;
      font-size: 13px;
      margin-top: 10px;
      padding: 10px 14px;
      background: #fef2f2;
      border-radius: 8px;
      border: 1px solid #fecaca;
      display: none;
    }

    .tag {
      display: inline-block;
      background: #ede9fe;
      color: #5b21b6;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <h1>✦ AI Resume Builder</h1>
  <p class="subtitle">Fill in your details — AI will craft a professional resume for you</p>

  <div class="container">

    <!-- Personal Info -->
    <div class="card">
      <h2>👤 Personal info</h2>

      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="e.g. Ali Hassan" />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ali@example.com" />

      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="+92 300 1234567" />

      <label for="location">City / Location</label>
      <input type="text" id="location" placeholder="Islamabad, Pakistan" />

      <label for="linkedin">LinkedIn (optional)</label>
      <input type="text" id="linkedin" placeholder="linkedin.com/in/alihassan" />

      <label for="github">GitHub (optional)</label>
      <input type="text" id="github" placeholder="github.com/alihassan" />
    </div>

    <!-- Education & Skills -->
    <div class="card">
      <h2>🎓 Education & skills</h2>

      <label for="degree">Degree & major</label>
      <input type="text" id="degree" placeholder="BS Computer Science" />

      <label for="university">University</label>
      <input type="text" id="university" placeholder="COMSATS University Islamabad" />

      <label for="semester">Current semester / Year</label>
      <input type="text" id="semester" placeholder="6th semester (2022–2026)" />

      <label for="skills">Technical skills</label>
      <textarea id="skills" placeholder="Python, JavaScript, HTML/CSS, OOP, Git, SQL..."></textarea>

      <label for="softskills">Soft skills</label>
      <textarea id="softskills" placeholder="Problem solving, teamwork, communication..." style="min-height:60px"></textarea>
    </div>

    <!-- Projects -->
    <div class="card">
      <h2>💻 Projects</h2>

      <label for="projects">Describe your projects</label>
      <textarea id="projects" placeholder="1. Student management system – built with Python & MySQL, manages records for 500+ students&#10;2. Portfolio website – HTML/CSS/JS, deployed on GitHub Pages" style="min-height:130px"></textarea>
    </div>

    <!-- Experience & Extra -->
    <div class="card">
      <h2>📋 Experience & extras</h2>

      <label for="experience">Work / internship experience (if any)</label>
      <textarea id="experience" placeholder="Leave blank if none. Or: Freelance web developer, 3 months — built landing pages for local businesses"></textarea>

      <label for="achievements">Achievements / certifications</label>
      <textarea id="achievements" placeholder="Google IT Support Certificate, Dean's list 2023, 1st place in university hackathon..."></textarea>

      <label for="role">Target job role</label>
      <input type="text" id="role" placeholder="Software Engineer Intern / Junior Web Developer" />

      <button class="btn" id="generate-btn" onclick="generateResume()">
        Generate my resume
      </button>

      <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- Output -->
    <div class="card output-card" id="output-card">
      <h2>📄 Your AI-generated resume <span class="tag">Ready</span></h2>
      <div id="resume-output">Your resume will appear here...</div>
      <button class="copy-btn" onclick="copyResume()">📋 Copy to clipboard</button>
    </div>

  </div>

  <script>
    async function generateResume() {
      const btn = document.getElementById('generate-btn');
      const errorEl = document.getElementById('error-msg');
      const outputCard = document.getElementById('output-card');
      const outputEl = document.getElementById('resume-output');

      errorEl.style.display = 'none';

      const data = {
        name:        document.getElementById('name').value.trim(),
        email:       document.getElementById('email').value.trim(),
        phone:       document.getElementById('phone').value.trim(),
        location:    document.getElementById('location').value.trim(),
        linkedin:    document.getElementById('linkedin').value.trim(),
        github:      document.getElementById('github').value.trim(),
        degree:      document.getElementById('degree').value.trim(),
        university:  document.getElementById('university').value.trim(),
        semester:    document.getElementById('semester').value.trim(),
        skills:      document.getElementById('skills').value.trim(),
        softskills:  document.getElementById('softskills').value.trim(),
        projects:    document.getElementById('projects').value.trim(),
        experience:  document.getElementById('experience').value.trim(),
        achievements:document.getElementById('achievements').value.trim(),
        role:        document.getElementById('role').value.trim(),
      };

      if (!data.name || !data.degree || !data.skills) {
        errorEl.textContent = 'Please fill in at least your name, degree, and skills.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Generating...';
      outputCard.classList.remove('visible');

      const prompt = `You are a professional resume writer. Create a clean, well-structured resume for a Pakistani CS student applying for tech internships.

Here are the candidate's details:
- Name: ${data.name}
- Email: ${data.email}
- Phone: ${data.phone}
- Location: ${data.location}
${data.linkedin ? `- LinkedIn: ${data.linkedin}` : ''}
${data.github ? `- GitHub: ${data.github}` : ''}
- Degree: ${data.degree}
- University: ${data.university}
- Current: ${data.semester}
- Technical skills: ${data.skills}
- Soft skills: ${data.softskills}
- Projects: ${data.projects}
- Experience: ${data.experience || 'None yet'}
- Achievements: ${data.achievements || 'None listed'}
- Target role: ${data.role}

Write a complete, professional resume with these sections (use plain text formatting with clear headings):
1. Header (name + contact info)
2. Objective (2-3 sentences tailored to the target role)
3. Education
4. Technical Skills
5. Projects (with bullet points showing impact)
6. Experience (if any)
7. Achievements & Certifications (if any)

Make it concise, ATS-friendly, and compelling. Use strong action verbs. Keep it to one page length. Do not add any commentary outside the resume itself.`;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });

        const result = await response.json();

        if (result.error) {
          throw new Error(result.error.message || 'API error');
        }

        const resumeText = result.content
          .filter(b => b.type === 'text')
          .map(b => b.text)
          .join('\n');

        outputEl.textContent = resumeText;
        outputCard.classList.add('visible');
        outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (err) {
        errorEl.textContent = 'Something went wrong: ' + err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Generate my resume';
      }
    }

    function copyResume() {
      const text = document.getElementById('resume-output').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = '📋 Copy to clipboard', 2000);
      });
    }
  </script>

</body>
</html>
